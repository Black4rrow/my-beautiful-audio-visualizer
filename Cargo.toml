[package]
name = "spectra"
version = "0.1.0"
edition = "2024"
description = "Real-time audio visualizer for Windows"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
pollster = "1.0.1"
realfft = "3.5.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
wgpu = "30.0.1"
winit = "0.30.13"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
