# Builds and checks the native app on GitHub's Windows runners (the work PC's antivirus blocks local builds).
# The release exe is attached to each run as the "spectra-windows" artifact.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: spectra-windows
          path: target/release/spectra.exe
          if-no-files-found: error
